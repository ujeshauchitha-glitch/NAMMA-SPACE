name: Deploy Spark fallback viewer to GitHub Pages (manual)

# MANUAL ONLY while the repo holds two viewers (see docs/round1/INTEGRATION.md). Builds spark-viewer/ and publishes it. Requires: repo Settings -> Pages -> Source = "GitHub Actions".
# The reconstructed splat must be committed under spark-viewer/public/models/ (see docs/round1/SUBMISSION.md).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spark-viewer/package-lock.json
      - run: npm ci
        working-directory: spark-viewer
      - run: npm run build
        working-directory: spark-viewer
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: spark-viewer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
